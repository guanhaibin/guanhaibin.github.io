<svg width="100%" viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>A red toolbox with a handle, latches, a screwdriver and a wrench</title>
  <desc>An illustrated red toolbox seen from the front, with a carry handle on top and a screwdriver and wrench poking out.</desc>

  <!-- carry handle (behind) -->
  <path d="M116 82 Q116 46 150 46 Q184 46 184 82"
        stroke="#3a3550" stroke-width="13" fill="none" stroke-linecap="round"/>
  <path d="M116 82 Q116 46 150 46 Q184 46 184 82"
        stroke="#5a5470" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- screwdriver poking out (left) -->
  <g transform="rotate(-16 108 58)">
    <rect x="103" y="42" width="8" height="40" fill="#c3ccd2" stroke="#2f2a3c" stroke-width="2.4"/>
    <rect x="96" y="20" width="22" height="26" rx="7" fill="#a4cedb" stroke="#2f2a3c" stroke-width="2.6"/>
  </g>

  <!-- wrench poking out (right) -->
  <g transform="rotate(15 194 58)">
    <rect x="189" y="44" width="9" height="40" rx="3" fill="#c3ccd2" stroke="#2f2a3c" stroke-width="2.4"/>
    <circle cx="193.5" cy="36" r="12" fill="#c3ccd2" stroke="#2f2a3c" stroke-width="2.6"/>
    <circle cx="193.5" cy="36" r="5" fill="#ffffff" stroke="#2f2a3c" stroke-width="2"/>
  </g>

  <!-- top tray / lid -->
  <rect x="72" y="74" width="156" height="36" rx="9" fill="#e06b5e" stroke="#2f2a3c" stroke-width="3.6"/>

  <!-- body -->
  <rect x="62" y="104" width="176" height="92" rx="13" fill="#d4574b" stroke="#2f2a3c" stroke-width="3.6"/>

  <!-- seam highlight -->
  <path d="M70 116 L230 116" stroke="#b8443b" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- latches -->
  <rect x="94" y="100" width="18" height="20" rx="3" fill="#dfe4e7" stroke="#2f2a3c" stroke-width="2.6"/>
  <rect x="188" y="100" width="18" height="20" rx="3" fill="#dfe4e7" stroke="#2f2a3c" stroke-width="2.6"/>

  <!-- front pull -->
  <rect x="132" y="150" width="36" height="10" rx="5" fill="#b8443b" stroke="#2f2a3c" stroke-width="2.6"/>
</svg>
