<svg viewBox="0 0 600 812" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Haibin skills card with focus bar charts</title>
  <desc>Profile card with pronouns, languages, expertise, Shiny apps, omics focus, a fun fact, a weakness, plus bar charts for preferred working hours and multi-omics focus.</desc>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="8" y="8" width="584" height="796" rx="16" fill="#211f2b" stroke="#39354a" stroke-width="1"/>

    <text x="32" y="52" font-size="27" font-weight="500" fill="#f3f1f8">Haibin</text>
    <rect x="128" y="34" width="86" height="23" rx="11.5" fill="#2f3a40"/>
    <text x="171" y="50" font-size="12.5" fill="#a4cedb" text-anchor="middle">she / her</text>
    <line x1="32" y1="70" x2="568" y2="70" stroke="#332f43" stroke-width="1"/>

    <text x="32" y="96" font-size="11" letter-spacing="1.6" fill="#8b88a0">CODE</text>
    <g font-size="13.5" fill="#c7dbe2">
      <rect x="32" y="106" width="34" height="27" rx="13.5" fill="#2b2839"/><text x="49" y="124" text-anchor="middle">R</text>
      <rect x="74" y="106" width="56" height="27" rx="13.5" fill="#2b2839"/><text x="102" y="124" text-anchor="middle">HTML</text>
      <rect x="138" y="106" width="50" height="27" rx="13.5" fill="#2b2839"/><text x="163" y="124" text-anchor="middle">CSS</text>
      <rect x="196" y="106" width="66" height="27" rx="13.5" fill="#2b2839"/><text x="229" y="124" text-anchor="middle">Python</text>
      <rect x="270" y="106" width="72" height="27" rx="13.5" fill="#2b2839"/><text x="306" y="124" text-anchor="middle">MATLAB</text>
    </g>

    <text x="32" y="160" font-size="11" letter-spacing="1.6" fill="#8b88a0">ASK ME ABOUT</text>
    <g font-size="13.5" fill="#c7dbe2">
      <rect x="32" y="170" width="206" height="28" rx="14" fill="#2b2839"/><text x="135" y="188" text-anchor="middle">Multi-Omics Data Analysis</text>
      <rect x="246" y="170" width="152" height="28" rx="14" fill="#2b2839"/><text x="322" y="188" text-anchor="middle">Data Visualization</text>
      <rect x="32" y="204" width="106" height="28" rx="14" fill="#2b2839"/><text x="85" y="222" text-anchor="middle">3D Modeling</text>
      <rect x="146" y="204" width="146" height="28" rx="14" fill="#2b2839"/><text x="219" y="222" text-anchor="middle">Shiny App Design</text>
    </g>

    <text x="32" y="258" font-size="11" letter-spacing="1.6" fill="#8b88a0">OMICS DATA</text>
    <circle cx="470" cy="254" r="4" fill="#a4cedb"/>
    <text x="482" y="258" font-size="11" fill="#8b88a0">current focus</text>
    <g font-size="13.5">
      <rect x="32" y="268" width="120" height="28" rx="14" fill="#a4cedb"/><text x="92" y="286" text-anchor="middle" fill="#182529" font-weight="500">Metabolomics</text>
      <rect x="160" y="268" width="102" height="28" rx="14" fill="#2b2839"/><text x="211" y="286" text-anchor="middle" fill="#c7dbe2">Proteomics</text>
      <rect x="270" y="268" width="110" height="28" rx="14" fill="#a4cedb"/><text x="325" y="286" text-anchor="middle" fill="#182529" font-weight="500">Exposomics</text>
      <rect x="388" y="268" width="140" height="28" rx="14" fill="#2b2839"/><text x="458" y="286" text-anchor="middle" fill="#c7dbe2">Transcriptomics</text>
    </g>

    <text x="32" y="320" font-size="11" letter-spacing="1.6" fill="#8b88a0">SHINY APPS</text>
    <g font-size="13.5" fill="#e9cfb4">
      <rect x="32" y="330" width="176" height="28" rx="14" fill="#302a34"/><text x="120" y="348" text-anchor="middle">WorklistsGenerator</text>
      <rect x="216" y="330" width="98" height="28" rx="14" fill="#302a34"/><text x="265" y="348" text-anchor="middle">BatCheck</text>
    </g>

    <text x="32" y="384" font-size="11" letter-spacing="1.6" fill="#8b88a0">FUN FACT</text>
    <rect x="32" y="392" width="536" height="66" rx="10" fill="#2a2636"/>
    <rect x="32" y="392" width="4" height="66" fill="#fbe0cb"/>
    <text x="52" y="420" font-size="13.5" font-style="italic" font-family="Georgia, 'Times New Roman', serif" fill="#d9d6e4">Tiny molecules make a big difference. Genomics tells you what you might</text>
    <text x="52" y="440" font-size="13.5" font-style="italic" font-family="Georgia, 'Times New Roman', serif" fill="#d9d6e4">have, while metabolomics tells you what you do have.</text>

    <text x="32" y="484" font-size="12.5" fill="#807d92">Weakness — multitasking</text>

    <line x1="32" y1="508" x2="568" y2="508" stroke="#332f43" stroke-width="1"/>

    <text x="32" y="536" font-size="14" font-weight="500" fill="#e7e5ef">I love working in the early morning</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13">
      <text x="32" y="567" fill="#b9c7cf">6:00 – 11:00 AM</text>
      <rect x="190" y="553" width="280" height="18" rx="9" fill="#2b2839" stroke="#3a3650" stroke-width="1"/>
      <rect x="190" y="553" width="196" height="18" rx="9" fill="#a4cedb"/>
      <text x="560" y="567" text-anchor="end" fill="#c7dbe2">70%</text>

      <text x="32" y="593" fill="#b9c7cf">12:00 – 16:00 PM</text>
      <rect x="190" y="579" width="280" height="18" rx="9" fill="#2b2839" stroke="#3a3650" stroke-width="1"/>
      <rect x="190" y="579" width="56" height="18" rx="9" fill="#a4cedb"/>
      <text x="560" y="593" text-anchor="end" fill="#c7dbe2">20%</text>

      <text x="32" y="619" fill="#b9c7cf">16:00 – 21:00 PM</text>
      <rect x="190" y="605" width="280" height="18" rx="9" fill="#2b2839" stroke="#3a3650" stroke-width="1"/>
      <rect x="190" y="605" width="28" height="18" rx="9" fill="#a4cedb"/>
      <text x="560" y="619" text-anchor="end" fill="#c7dbe2">10%</text>
    </g>

    <text x="32" y="652" font-size="14" font-weight="500" fill="#e7e5ef">Multi-omics current focus</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13">
      <text x="32" y="683" fill="#b9c7cf">Genomics</text>
      <rect x="190" y="669" width="280" height="18" rx="9" fill="#2b2839" stroke="#3a3650" stroke-width="1"/>
      <rect x="190" y="669" width="14" height="18" rx="9" fill="#a4cedb"/>
      <text x="560" y="683" text-anchor="end" fill="#c7dbe2">5%</text>

      <text x="32" y="709" fill="#b9c7cf">Transcriptomics</text>
      <rect x="190" y="695" width="280" height="18" rx="9" fill="#2b2839" stroke="#3a3650" stroke-width="1"/>
      <rect x="190" y="695" width="14" height="18" rx="9" fill="#a4cedb"/>
      <text x="560" y="709" text-anchor="end" fill="#c7dbe2">5%</text>

      <text x="32" y="735" fill="#b9c7cf">Proteomics</text>
      <rect x="190" y="721" width="280" height="18" rx="9" fill="#2b2839" stroke="#3a3650" stroke-width="1"/>
      <rect x="190" y="721" width="14" height="18" rx="9" fill="#a4cedb"/>
      <text x="560" y="735" text-anchor="end" fill="#c7dbe2">5%</text>

      <text x="32" y="761" fill="#b9c7cf">Metabolomics</text>
      <rect x="190" y="747" width="280" height="18" rx="9" fill="#2b2839" stroke="#3a3650" stroke-width="1"/>
      <rect x="190" y="747" width="140" height="18" rx="9" fill="#a4cedb"/>
      <text x="560" y="761" text-anchor="end" fill="#c7dbe2">50%</text>

      <text x="32" y="787" fill="#b9c7cf">Exposomics</text>
      <rect x="190" y="773" width="280" height="18" rx="9" fill="#2b2839" stroke="#3a3650" stroke-width="1"/>
      <rect x="190" y="773" width="98" height="18" rx="9" fill="#a4cedb"/>
      <text x="560" y="787" text-anchor="end" fill="#c7dbe2">35%</text>
    </g>
  </g>
</svg>
